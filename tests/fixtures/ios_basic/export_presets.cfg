; Fixture export_presets.cfg for the App Release test suite.
;
; Mirrors the real format Godot writes: one [preset.N] + [preset.N.options] pair
; per export preset. Kept minimal — only the keys the plugin's readers/patcher
; actually touch (core/export_presets_reader.gd, core/version_patcher.gd).
;
; The iOS preset deliberately omits version/name + version/code so version_of()
; exercises its fallback to application/short_version + application/version.
; The Android preset has both so the preferred-key path is exercised too.

[preset.0]

name="iOS"
platform="iOS"
export_path="build/ios/App Release.ipa"

[preset.0.options]

application/app_store_team_id="ABCDE12345"
application/bundle_identifier="com.example.apprelease.ios"
application/short_version="1.0.0"
application/version="1"

[preset.1]

name="Android"
platform="Android"
export_path="build/android/App Release.aab"

[preset.1.options]

package/unique_name="com.example.apprelease.android"
gradle_build/use_gradle_build=true
gradle_build/export_format=1
version/name="2.5.0"
version/code=7
