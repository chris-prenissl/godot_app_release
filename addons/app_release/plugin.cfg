[plugin]

name="App Release"
description="Export a Godot project for mobile and ship it to TestFlight, the App Store, Firebase App Distribution and Google Play with fastlane — from an editor tab, with a live log and per-store release lists."
author="Christoph Prenissl"
version="0.9.0"
script="app_release.gd"
license="MIT"
repository="https://github.com/chris-prenissl/godot_app_release"
keywords=[
    "tool",
    "release",
    "fastlane",
    "testflight",
    "app-store",
    "google-play",
    "firebase",
	"ios",
	"android"
]
classifiers=[
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License"
]

[plugin.dependencies]
godot=">=4.4"
